<svg xmlns="http://www.w3.org/2000/svg" width="860" height="568" viewBox="0 0 860 568" role="img" aria-labelledby="title desc">
<title id="title">결과는 stdout, 안내·오류는 stderr — 셸 기호로 두 통로를 따로 돌린다</title>
<desc id="desc">프로그램은 결과를 1번 통로 stdout 으로, [오류]와 [힌트]와 로그를 2번 통로 stderr 로 내보낸다. 그냥 실행하면 둘 다 화면에 섞여 보이고, &gt; list.txt 는 결과만 파일로, 2&gt;/dev/null 은 오류만 버리고, | head -3 은 결과만 다음 프로그램에 넘긴다. 끝날 때는 종료 코드 숫자 하나를 셸에 남긴다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
  .box{fill:#F4F3EF;stroke:#9A9CA3;stroke-width:1.5}
  .zone{fill:#FAF9F6;stroke:#C9C6BE;stroke-width:1.2;stroke-dasharray:5 4}
  .blue{fill:#E7EFF9;stroke:#1F5FAD;stroke-width:1.6}
  .green{fill:#E6F4EC;stroke:#1B7F4B;stroke-width:1.6}
  .orange{fill:#FCEFE0;stroke:#B25E09;stroke-width:1.6}
  .red{fill:#FCEBEA;stroke:#B42318;stroke-width:1.6}
  .purple{fill:#F1EAFB;stroke:#6E3FB0;stroke-width:1.6}
  .yellow{fill:#FFF3C4;stroke:#A07800;stroke-width:1.6}
  .c-blue{fill:#1F5FAD}.c-green{fill:#1B7F4B}.c-orange{fill:#B25E09}.c-red{fill:#B42318}.c-purple{fill:#6E3FB0}.c-muted{fill:#5B6069}
  .ln{stroke:#6B7078;stroke-width:1.6;fill:none}
  .ln-blue{stroke:#1F5FAD}.ln-green{stroke:#1B7F4B}.ln-red{stroke:#B42318}.ln-orange{stroke:#B25E09}.ln-purple{stroke:#6E3FB0}
  .dash{stroke-dasharray:6 5}
  .ah{fill:#6B7078}.ah-blue{fill:#1F5FAD}.ah-green{fill:#1B7F4B}.ah-red{fill:#B42318}.ah-orange{fill:#B25E09}.ah-purple{fill:#6E3FB0}
  @media (prefers-color-scheme:dark){
    text{fill:#E8E6E1}
    .bg{fill:#1A1C20}
    .ts{fill:#A9A69F}
    .box{fill:#24262B;stroke:#6B6E76}
    .zone{fill:#1F2125;stroke:#43464D}
    .blue{fill:#1B2940;stroke:#7FB0F0}
    .green{fill:#16281E;stroke:#5FC98E}
    .orange{fill:#2E2215;stroke:#E8A05A}
    .red{fill:#301A18;stroke:#F08A80}
    .purple{fill:#251C33;stroke:#C3A0F0}
    .yellow{fill:#2E2812;stroke:#E3C45C}
    .c-blue{fill:#9CC4F5}.c-green{fill:#7ED3A3}.c-orange{fill:#EDB27A}.c-red{fill:#F4A39B}.c-purple{fill:#D2B8F4}.c-muted{fill:#A9A69F}
    .ln{stroke:#8D9098}
    .ln-blue{stroke:#7FB0F0}.ln-green{stroke:#5FC98E}.ln-red{stroke:#F08A80}.ln-orange{stroke:#E8A05A}.ln-purple{stroke:#C3A0F0}
    .ah{fill:#8D9098}.ah-blue{fill:#7FB0F0}.ah-green{fill:#5FC98E}.ah-red{fill:#F08A80}.ah-orange{fill:#E8A05A}.ah-purple{fill:#C3A0F0}
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-blue" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-red" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-green" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-orange" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah-purple" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="860" height="568"/>
<text class="th" x="24" y="36">결과와 오류는 다른 통로로 나간다 — 셸 기호가 두 통로를 따로 돌린다</text>
<text class="ts" x="24" y="58"><tspan class="c-green">초록 실선 = stdout(1번 통로, 결과)</tspan> · <tspan class="c-red">빨간 점선 = stderr(2번 통로, [오류]/[힌트]·로그)</tspan></text>
<rect class="zone" x="24" y="80" width="394" height="204" rx="12"/>
<text class="tb" x="40" y="106">① 기본 — 둘 다 화면으로</text>
<text class="mono" x="40" y="128">$ python3 -m budget_app list</text>
<rect class="box" x="40" y="152" width="112" height="102" rx="10"/>
<text class="mono tb" x="96" y="199" text-anchor="middle">budget_app</text>
<text class="ts" x="96" y="219" text-anchor="middle">프로세스</text>
<line class="ln ln-green" x1="152" y1="176" x2="256" y2="176" marker-end="url(#arrow-green)"/>
<line class="ln ln-red dash" x1="152" y1="230" x2="256" y2="230" marker-end="url(#arrow-red)"/>
<text class="mono c-green" x="206" y="167" text-anchor="middle">1 stdout</text>
<text class="mono c-red" x="206" y="221" text-anchor="middle">2 stderr</text>
<rect class="box" x="260" y="152" width="142" height="102" rx="10"/>
<text class="tb" x="331" y="199" text-anchor="middle">화면(터미널)</text>
<text class="ts" x="331" y="219" text-anchor="middle">결과와 [오류]가 함께</text>
<text class="ts" x="40" y="276">화면에서는 둘이 섞여 구별되지 않는다</text>
<rect class="zone" x="442" y="80" width="394" height="204" rx="12"/>
<text class="tb" x="458" y="106">② &gt; 파일 — 결과만 파일로</text>
<text class="mono" x="458" y="128">$ python3 -m budget_app list &gt; list.txt</text>
<rect class="box" x="458" y="152" width="112" height="102" rx="10"/>
<text class="mono tb" x="514" y="199" text-anchor="middle">budget_app</text>
<text class="ts" x="514" y="219" text-anchor="middle">프로세스</text>
<line class="ln ln-green" x1="570" y1="176" x2="674" y2="176" marker-end="url(#arrow-green)"/>
<line class="ln ln-red dash" x1="570" y1="230" x2="674" y2="230" marker-end="url(#arrow-red)"/>
<text class="mono c-green" x="624" y="167" text-anchor="middle">1 stdout</text>
<text class="mono c-red" x="624" y="221" text-anchor="middle">2 stderr</text>
<rect class="purple" x="678" y="152" width="142" height="48" rx="10"/>
<text class="mono tb c-purple" x="749" y="172" text-anchor="middle">list.txt</text>
<text class="ts" x="749" y="190" text-anchor="middle">파일(결과 표만)</text>
<rect class="box" x="678" y="206" width="142" height="48" rx="10"/>
<text class="tb" x="749" y="235" text-anchor="middle">화면(터미널)</text>
<text class="ts" x="458" y="276">list.txt 에는 표만 — 오류 글자가 섞이지 않는다</text>
<rect class="zone" x="24" y="308" width="394" height="204" rx="12"/>
<text class="tb" x="40" y="334">③ 2&gt;/dev/null — 오류만 버린다</text>
<text class="mono" x="40" y="356">$ python3 -m budget_app list 2&gt;/dev/null</text>
<rect class="box" x="40" y="380" width="112" height="102" rx="10"/>
<text class="mono tb" x="96" y="427" text-anchor="middle">budget_app</text>
<text class="ts" x="96" y="447" text-anchor="middle">프로세스</text>
<line class="ln ln-green" x1="152" y1="404" x2="256" y2="404" marker-end="url(#arrow-green)"/>
<line class="ln ln-red dash" x1="152" y1="458" x2="256" y2="458" marker-end="url(#arrow-red)"/>
<text class="mono c-green" x="206" y="395" text-anchor="middle">1 stdout</text>
<text class="mono c-red" x="206" y="449" text-anchor="middle">2 stderr</text>
<rect class="box" x="260" y="380" width="142" height="48" rx="10"/>
<text class="tb" x="331" y="409" text-anchor="middle">화면(터미널)</text>
<rect class="box dash" x="260" y="434" width="142" height="48" rx="10"/>
<text class="mono tb" x="331" y="454" text-anchor="middle">/dev/null</text>
<text class="ts" x="331" y="472" text-anchor="middle">버리는 곳</text>
<text class="ts" x="40" y="504">오류가 나면 두 줄은 사라지고 종료 코드만 남는다</text>
<rect class="zone" x="442" y="308" width="394" height="204" rx="12"/>
<text class="tb" x="458" y="334">④ | 파이프 — 결과를 다음 프로그램에</text>
<text class="mono" x="458" y="356">$ python3 -m budget_app list | head -3</text>
<rect class="box" x="458" y="380" width="112" height="102" rx="10"/>
<text class="mono tb" x="514" y="427" text-anchor="middle">budget_app</text>
<text class="ts" x="514" y="447" text-anchor="middle">프로세스</text>
<line class="ln ln-green" x1="570" y1="404" x2="674" y2="404" marker-end="url(#arrow-green)"/>
<line class="ln ln-red dash" x1="570" y1="458" x2="674" y2="458" marker-end="url(#arrow-red)"/>
<text class="mono c-green" x="624" y="395" text-anchor="middle">1 stdout</text>
<text class="mono c-red" x="624" y="449" text-anchor="middle">2 stderr</text>
<rect class="box" x="678" y="380" width="142" height="48" rx="10"/>
<text class="mono tb" x="749" y="400" text-anchor="middle">head -3</text>
<text class="ts" x="749" y="418" text-anchor="middle">다음 프로그램</text>
<rect class="box" x="678" y="434" width="142" height="48" rx="10"/>
<text class="tb" x="749" y="463" text-anchor="middle">화면(터미널)</text>
<text class="ts" x="458" y="504">head 가 먼저 닫아도 실패가 아니다 → 종료 코드 0</text>
<text class="ts" x="24" y="548">그리고 끝날 때 <tspan class="tb">종료 코드</tspan> 숫자 하나를 셸에 남긴다 — <tspan class="mono">echo $?</tspan> 로 본다(0 = 성공, 그 밖 = 실패). 이 숫자는 두 통로와 따로 전달된다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="880" height="736" viewBox="0 0 880 736" role="img" aria-labelledby="title desc">
<title id="title">budget_app 전체 구조 — 네 계층과 저장 파일</title>
<desc id="desc">사용자 명령은 cli, services, storage, domain 네 계층을 위에서 아래로만 내려가며 처리된다. 파일을 여는 코드는 storage 계층에만 있고, storage 가 data 폴더의 JSONL 파일 3개와 id_counter, 그리고 가져오기·내보내기용 CSV 파일을 읽고 쓴다. 결과는 stdout 으로, 오류와 힌트는 stderr 로 사용자에게 돌아간다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
